<svg xmlns="http://www.w3.org/2000/svg" width="36" height="20" viewBox="0 0 36 20"
     role="img" aria-label="ink">
  <!-- The warrant name set in its own colour. An inline SVG rather than a style attribute, which
       GitHub sanitises away, and rather than LaTeX colour, which renders on GitHub and NOWHERE
       ELSE - and this almanac is meant to be read from an unzipped folder as much as from a
       repository page. An image degrades to its alt text; a stripped style degrades to nothing. -->
  <text x="1" y="15" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="14" font-weight="600" fill="#ffffff">ink</text>
</svg>