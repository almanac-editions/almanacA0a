fidelity:
  divergences: "THREE, ALL DECLARED RATHER THAN DISCOVERED. (1) NOTATION. The Lean sources predate this project's 2026-08-10 notation migration and are written in legacy symbols: the Lean 'A_z' IS the manuscript's A_t, and the Lean 'Q' IS the manuscript's q. The edition restates the convention frame per result rather than rewriting the signed sources, and CONCORDANCE.json carries that frame on every row. A reader who assumes the Lean names mean what the manuscript names mean will misread them. (2) TWO RESULTS HAVE NO INFORMAL COUNTERPART. Two rows are formal-side guarantees with no counterpart environment in the manuscript; their informal file is recorded as null rather than the row being dropped. (3) THE CERTIFICATE'S REACH. A Lean declaration certifies the Lean statement and nothing else. The project's own rule, enforced per row: a row may not be called kernel-certified on the strength of a Lean proof if the claim the row makes is about the CODE rather than the mathematics. What the computational layer does and does not establish is set out separately in EMBEDDING_NOTE.md, and it is not a certificate."
