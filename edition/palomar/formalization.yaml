  notes: "NO EXTERNAL PEER REVIEW. No referee outside this project has read this work, and nothing here should be read as claiming otherwise. What the project does have is a structural separation: the seat that produces an artifact is never the seat that accepts it, and no agent approves its own work. The edition was accepted by the record owner on 2026-08-13 as a faithful and non-overclaiming account of the closed record — which is explicitly NOT deposit, NOT outward release, and NOT a freeze."
alignment:
  how_to_read_this: "The full statement-to-declaration alignment is a machine-readable artifact of this edition: CONCORDANCE.json. It carries one row per result, joining the informal manuscript, the computational instrument and the Lean development by an explicit convention frame under which all three sets of names denote one object, and records per row WHAT ACTUALLY CERTIFIES IT. Three parallel archives that a reader must align by hand would not be an edition; the concordance is the thing that makes it one."
  warrant_vocabulary:
    ink: "THE INK WARRANT. An argument written out for a human reader and refereed. The row pins it to a hashed document at a named location, so a reader can check they are reading the bytes the row cites; its ancestry was refereed at source, per row; and the proof itself was read by an independent adversarial referee, recorded at edition level. This is a warrant, not the absence of one — a refereed informal proof is what the other two are checked against. WHAT IT DOES NOT YET CARRY, stated because the other two warrants do carry it: a per-row record of WHO refereed THIS claim and when. Refereeing of the sources is per row; refereeing of the argument is recorded for the edition. Neither is yet a per-claim anchor."
    orange: "THE ORANGE WARRANT. Verified by computation over the bound in declared_range, and over nothing else. The bound is part of the claim."
    blue: "THE BLUE WARRANT. A Lean declaration states THIS ROW'S claim and its #print axioms result is exactly the clean triple with no sorryAx. The axioms field is the ACTUAL measured result, never a restatement of the sandbox's closed status."
  the_rule_that_matters: "warrant describes THIS ROW, not the sandbox. sandboxA0a is closed with a clean axiom triple; that does not make every row kernel_certified. A row whose Lean declaration is absent is not kernel-certified however green the sandbox is."
  rows_not_listed_as_main_results:
    - id: "A0a-10-instrument"
      warrant: "orange"
      why: "Verified by computation over a declared bound, and over nothing else. The bound is part of the claim. Not a kernel certificate, so not a main_result."
    - id: "A0a-11-n1-referee-pin"
      warrant: "orange"
      why: "Verified by computation over a declared bound, and over nothing else. The bound is part of the claim. Not a kernel certificate, so not a main_result."
